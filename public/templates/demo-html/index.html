<div class="demo-template">
  <div class="demo-header">
    <p class="greeting">{{greeting}}</p>
    <h1>{{groomName}} <span>&</span> {{brideName}}</h1>
    <p class="date">{{weddingDate}}</p>
  </div>

  <div class="demo-photo">
    <img src="{{photoUrl}}" alt="Foto Pasangan" />
  </div>

  <div class="demo-body">
    <h2>Save the Date</h2>
    
    <div class="demo-event">
      <h3>Akad Nikah</h3>
      <p>{{akadTime}}</p>
      <p><strong>{{akadVenue}}</strong></p>
    </div>

    <div class="demo-event">
      <h3>Resepsi</h3>
      <p>{{resepsiTime}}</p>
      <p><strong>{{resepsiVenue}}</strong></p>
    </div>

    <div class="demo-countdown">
      <div class="cd-box">{{days}}<span>Hari</span></div>
      <div class="cd-box">{{hours}}<span>Jam</span></div>
      <div class="cd-box">{{minutes}}<span>Menit</span></div>
      <div class="cd-box">{{seconds}}<span>Detik</span></div>
    </div>
  </div>
</div>
